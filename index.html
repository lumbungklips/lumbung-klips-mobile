
<script>
(function(){
  const el=id=>document.getElementById(id);

  const get=(key,fallback)=>{
    try{
      const v=localStorage.getItem(key);
      return v===null?fallback:JSON.parse(v);
    }catch(e){return fallback;}
  };

  const put=(key,value)=>{
    try{
      localStorage.setItem(key,JSON.stringify(value));
      return true;
    }catch(e){
      alert('Penyimpanan browser tidak tersedia.');
      return false;
    }
  };

  const money=v=>Number(v||0).toLocaleString('id-ID');

  function jump(id){
    const target=el(id);
    if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function refresh(){
    const products=get('lkp',[]);
    const ideas=get('lki',0);
    const report=get('lkr',null);

    el('pc').textContent=products.length;
    el('ic').textContent=ideas;
    el('cs').textContent='Rp'+money(report&&report.cm);

    el('po').textContent=products.length
      ?products.map((x,n)=>(n+1)+'. '+x.n+' | Rp'+money(x.p)+' | Komisi '+x.r+'%\n'+(x.t||'-')).join('\n\n')
      :'Belum ada produk.';

    if(report){
      el('ro').textContent=
        'Klik: '+report.cl+
        '\nPesanan: '+report.orders+
        '\nKomisi: Rp'+money(report.cm)+
        '\nKonversi: '+(report.cl?((report.orders/report.cl)*100).toFixed(2):'0.00')+'%';
    }
  }

  function saveProduct(){
    const name=el('rn').value.trim();
    if(!name){
      alert('Isi nama produk.');
      el('rn').focus();
      return;
    }

    const products=get('lkp',[]);
    products.push({
      n:name,
      p:el('rp').value||0,
      r:el('rr').value||0,
      t:el('rt').value
    });

    if(put('lkp',products)){
      ['rn','rp','rr','rt'].forEach(id=>el(id).value='');
      refresh();
      alert('Produk berhasil disimpan.');
    }
  }

  function saveReport(){
    if(put('lkr',{
      cl:+el('cl').value||0,
      orders:+el('orders').value||0,
      cm:+el('cm').value||0
    })){
      refresh();
      alert('Laporan berhasil disimpan.');
    }
  }

  function makeVideo(){
    const n=el('vn').value.trim()||'produk pilihan';
    const b=el('vb').value.trim()||'manfaat praktis';
    const a=el('va').value.trim()||'calon pembeli';

    const scripts=[
      ['HOOK: "Punya masalah seperti ini? Coba lihat '+n+'!"',
       'Tampilkan masalah yang sering dialami '+a+'.'],
      ['HOOK: "Perubahan kecil, dapur bisa terlihat lebih rapi!"',
       'Tampilkan kondisi sebelum dan sesudah memakai produk.'],
      ['HOOK: "Sebelum membeli, perhatikan detail produk ini!"',
       'Rekam bahan, ukuran, bentuk, dan bagian produk.'],
      ['HOOK: "Apakah produk ini praktis untuk kebutuhan sehari-hari?"',
       'Perlihatkan cara penggunaan produk secara nyata.'],
      ['HOOK: "Tinggal di ruang kecil? Ide ini mungkin cocok!"',
       'Tampilkan contoh penggunaan untuk ruangan terbatas.']
    ];

    el('vo').textContent=
      '5 PILIHAN NASKAH VIDEO: '+n+'\n\n'+
      scripts.map((s,i)=>
        (i+1)+'. '+s[0]+'\n'+
        'ADEGAN: '+s[1]+'\n'+
        'PENJELASAN: Tunjukkan '+n+' dan jelaskan keunggulan faktualnya: '+b+'.\n'+
        'CTA: "Cek harga, ukuran, dan ulasan produk di keranjang kuning."'
      ).join('\n\n');

    put('lki',Number(get('lki',0))+5);
    refresh();
  }

  function runCmd(){
    const input=el('cmd').value.trim();
    const output=el('co');

    if(!input){
      output.textContent='Silakan tulis perintah terlebih dahulu.';
      return;
    }

    const t=input.toLowerCase();
    const match=input.match(/produk\s+(.+?)(?:[,.]|$)/i);
    const product=match?match[1].trim():'produk pilihan';

    if(/ide/.test(t)&&/(video|konten|shopee)/.test(t)){
      el('vn').value=product;
      const ideas=[
        ['Masalah ke solusi',
         'HOOK: "Dapur berantakan terus? Coba lihat ide ini!"',
         'Tampilkan kondisi dapur sebelum ditata, lalu perlihatkan produk sebagai solusi penataan.',
         'CTA: "Cek detail dan ulasan produk di keranjang kuning."'],
        ['Before-after',
         'HOOK: "Lihat perubahan dapur sebelum dan sesudah ditata!"',
         'Rekam kondisi awal, proses penataan, dan hasil akhirnya.',
         'CTA: "Lihat produknya dan sesuaikan dengan ukuran dapurmu."'],
        ['Detail produk',
         'HOOK: "Jangan asal beli, perhatikan detail produk ini!"',
         'Tunjukkan bahan, ukuran, susunan tingkat, dan detail sesuai produk sebenarnya.',
         'CTA: "Cek spesifikasi lengkap dan harga di keranjang."'],
        ['Demo penggunaan',
         'HOOK: "Sepraktis apa rak ini untuk kebutuhan dapur?"',
         'Tunjukkan cara meletakkan barang dan kondisi rak saat digunakan.',
         'CTA: "Periksa ulasan pembeli sebelum menentukan pilihan."'],
        ['Cocok untuk siapa?',
         'HOOK: "Punya dapur kecil atau tinggal di kos?"',
         'Tampilkan contoh penataan bumbu dan perlengkapan dapur di ruang terbatas.',
         'CTA: "Cek ukuran dan pilih yang sesuai kebutuhanmu."']
      ];

      output.textContent='5 IDE VIDEO SHOPEE AFFILIATE: '+product+'\n\n'+
        ideas.map((x,i)=>
          (i+1)+'. '+x[0]+'\n'+x[1]+'\nKONSEP: '+x[2]+'\n'+
          'NASKAH: Perkenalkan '+product+', tunjukkan adegan sesuai konsep, lalu jelaskan manfaat berdasarkan kondisi produk sebenarnya.\n'+x[3]
        ).join('\n\n');

      put('lki',Number(get('lki',0))+5);
      refresh();
      return;
    }

    if(/video|skrip|naskah|caption/.test(t)){
      el('vn').value=product;
      el('vb').value='Isi sesuai keunggulan faktual produk';
      el('va').value='orang yang membutuhkan produk ini';
      makeVideo();
      output.textContent='Lima pilihan naskah sudah dibuat. Lihat bagian Video Creator.';
      jump('video');
      return;
    }

    if(/komisi|klik|pesanan|laporan/.test(t)){
      output.textContent='Buka modul Laporan untuk melihat data yang telah Anda catat. Dashboard belum mengambil data langsung dari Shopee.';
      jump('report');
      return;
    }

    if(/produk|riset|tren|viral|cari/.test(t)){
      output.textContent='Buka modul Riset untuk mencatat hasil pencarian produk. Riset otomatis belum aktif.';
      jump('research');
      return;
    }

    output.textContent='Perintah diterima, tetapi AI eksternal belum terhubung. Fitur ini belum dapat menjalankan tugas otomatis.';
  }

  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('[data-jump]').forEach(button=>{
      button.addEventListener('click',()=>jump(button.dataset.jump));
    });

    el('run').addEventListener('click',runCmd);

    el('example').addEventListener('click',()=>{
      el('cmd').value='Buat 5 ide video Shopee Affiliate untuk produk rak dapur minimalis.';
      el('co').textContent='Contoh perintah sudah diisi. Tekan Jalankan.';
    });

    el('make').addEventListener('click',makeVideo);
    el('saveProduct').addEventListener('click',saveProduct);
    el('saveReport').addEventListener('click',saveReport);
    refresh();
  });
})();
</script>
